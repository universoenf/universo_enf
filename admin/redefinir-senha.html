<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Redefinir senha | Universo ENF Admin</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f4ff;font:16px Arial,sans-serif;color:#33264b}main{width:min(92vw,430px);background:white;border-radius:22px;padding:28px;box-shadow:0 12px 38px #4c307722}h1{color:#6845a4;font-size:25px}input,button{width:100%;padding:14px;border-radius:12px;box-sizing:border-box;font:inherit;margin:9px 0}input{border:1px solid #ddd1ef}button{background:#7046ae;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}p{line-height:1.5}a{color:#6741a0}</style></head><body><main><h1>💜 Universo ENF Admin</h1><h2>Redefinir sua senha</h2><p id="status">Verificando o link de recuperação...</p><form id="form" hidden><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres"><button>Salvar nova senha</button></form><p><a href="./">Voltar ao painel administrativo</a></p></main><script type="module">import {SUPABASE_URL,SUPABASE_ANON_KEY} from "../supabase-config.js";import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),status=document.getElementById("status"),form=document.getElementById("form");const params=new URLSearchParams(location.search);async function init(){try{if(params.get("code")){const {error}=await db.auth.exchangeCodeForSession(params.get("code"));if(error)throw error;history.replaceState({},document.title,location.pathname)}const {data:{session}}=await db.auth.getSession();if(!session){status.textContent="Link inválido ou expirado. Solicite um novo link de recuperação.";return}status.textContent="Digite sua nova senha abaixo.";form.hidden=false}catch{status.textContent="Não foi possível validar o link. Solicite outro e-mail de recuperação."}}db.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){status.textContent="Digite sua nova senha abaixo.";form.hidden=false}});form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;const {error}=await db.auth.updateUser({password:document.getElementById("password").value});document.getElementById("password").value="";button.disabled=false;if(error){status.textContent="Não foi possível atualizar a senha. Solicite outro link.";return}form.hidden=true;await db.auth.signOut();status.textContent="Senha alterada! Agora você pode entrar no painel administrativo."});init();</script></body></html>
